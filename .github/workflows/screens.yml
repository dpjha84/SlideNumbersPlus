name: Emulator screenshots

# Manual check of the real app: runs it on an emulator and publishes screenshots.
on:
  workflow_dispatch:
  push:
    paths:
      - tools/ci_screens.py
      - .github/workflows/screens.yml

permissions:
  contents: read

jobs:
  screens:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew assembleDebug
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: default
          profile: pixel_6
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-audio -no-boot-anim
          script: python3 tools/ci_screens.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screens
          path: screens/
          retention-days: 14
      # small copies in the log, for reviewers who cannot download artifacts
      - name: Print thumbnails
        if: always()
        run: |
          pip install --quiet pillow
          python3 - <<'PY'
          import base64, glob, io
          from PIL import Image
          for path in sorted(glob.glob("screens/*.png")):
              image = Image.open(path).convert("RGB")
              image.thumbnail((360, 800))
              out = io.BytesIO()
              image.save(out, "JPEG", quality=70)
              print("IMG", path, base64.b64encode(out.getvalue()).decode())
          PY
