name: Android CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests and assemble debug APKs
        run: ./gradlew testDebugUnitTest assembleDebug

      - name: Publish debug APK
        uses: actions/upload-artifact@v4
        with:
          name: sliding-numbers-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Build release AAB
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64$ANDROID_KEYSTORE_PASSWORD$ANDROID_KEY_ALIAS$ANDROID_KEY_PASSWORD" ]; then
            if [ -z "$ANDROID_KEYSTORE_BASE64" ] || [ -z "$ANDROID_KEYSTORE_PASSWORD" ] || [ -z "$ANDROID_KEY_ALIAS" ] || [ -z "$ANDROID_KEY_PASSWORD" ]; then
              echo "All four Android signing secrets are required to sign the release AAB."
              exit 1
            fi
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
            export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/release.keystore"
          fi
          echo "Building release AAB (signed when Android signing secrets are configured)."
          ./gradlew bundleRelease

      # compare this SHA1 with "Upload key certificate" under App integrity in Play Console
      - name: Show who signed the release AAB
        run: |
          out=$(keytool -printcert -jarfile app/build/outputs/bundle/release/*.aab)
          echo "$out" | grep -E "SHA1:|SHA256:|Not a signed jar file"
          if echo "$out" | grep -q "SHA1:"; then
            echo "::notice title=Release AAB signed::$(echo "$out" | grep -m1 'SHA1:' | xargs)"
          else
            echo "::warning title=Release AAB is NOT signed::Add the four Android signing secrets."
          fi

      - name: Publish release AAB
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: sliding-numbers-release-aab
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 14

  # one fixed link that downloads the newest debug APK on a phone, without signing in or unzipping
  test-build:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/v3-rewrite'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: sliding-numbers-debug-apk
          path: apk
      - name: Replace the APK on the test-build prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          cp apk/*.apk SlidingNumbers-test.apk
          notes="Debug build of commit $GITHUB_SHA. Test ads only. Not for release."
          if gh release view test-build --repo "$REPO" >/dev/null 2>&1; then
            gh release upload test-build SlidingNumbers-test.apk --clobber --repo "$REPO"
            gh release edit test-build --notes "$notes" --repo "$REPO"
          else
            gh release create test-build SlidingNumbers-test.apk --prerelease --target "$GITHUB_SHA" --title "Test build" --notes "$notes" --repo "$REPO"
          fi
