<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>Sliding Numbers+ 3.0 Preview</title>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
/* Layout: full-bleed living city behind; one phone column on top. Home = title in the sky, controls over the water. */
:root{--ink:#150f33;--panel:rgba(24,16,58,.66);--line:rgba(255,236,200,.16);--cream:#fff4dc;--gold:#ffc54d;--gold-d:#c9771a;--coral:#ff6b6b;--teal:#43e6d2;
--disp:'Lilita One','Arial Rounded MT Bold',system-ui,sans-serif;--body:'Nunito',system-ui,sans-serif;color-scheme:dark}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:var(--ink);color:var(--cream);font-family:var(--body);font-weight:700;user-select:none;-webkit-user-select:none}
#veil{position:fixed;inset:0;background:rgba(12,14,34,.34);opacity:0;transition:opacity .8s;pointer-events:none}
body.playing #veil{opacity:1}
#sky{transition:filter .8s}
#sky,#fx{position:fixed;inset:0;width:100%;height:100%;display:block}
#fx{pointer-events:none;z-index:30}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
button:focus-visible{outline:3px solid #fff;outline-offset:2px}
.screen{position:fixed;inset:0;max-width:440px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 12px) 16px calc(env(safe-area-inset-bottom,0px) + 10px);display:flex;flex-direction:column;overflow-y:auto;overflow-x:hidden;z-index:2;transition:opacity .22s,transform .22s}
.screen.off{opacity:0;transform:scale(1.04);pointer-events:none;visibility:hidden;transition:opacity .22s,transform .22s,visibility 0s .22s}
.bar{display:flex;justify-content:space-between;align-items:center;gap:8px}
.chip{display:flex;align-items:center;gap:6px;height:36px;padding:0 12px 0 6px;border-radius:99px;background:var(--panel);border:1px solid var(--line);font-family:var(--disp);font-weight:400;font-size:16px;font-variant-numeric:tabular-nums}
.coin,.gem,.star{width:24px;height:24px;flex:none}
.round{width:40px;height:40px;border-radius:14px;background:var(--panel);border:1px solid var(--line);display:grid;place-items:center;flex:none}
.round svg{width:20px;height:20px}
.logo{text-align:center;margin-top:3.5vh;font-family:var(--disp);font-weight:400;line-height:.88;filter:drop-shadow(0 6px 14px rgba(20,8,50,.55))}
.logo svg{width:min(100%,350px);height:auto;overflow:visible}
.space{flex:1;min-height:40px}
.route{position:relative;display:flex;justify-content:space-between;padding:0 4px;margin-bottom:10px}
.route::before{content:"";position:absolute;left:36px;right:36px;top:20px;border-top:3px dotted rgba(255,244,220,.55)}
.stop{position:relative;display:grid;justify-items:center;gap:4px;font-size:12px;width:84px;text-shadow:0 1px 6px #000}
.stop i{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font:400 17px var(--disp);background:#2c2060;border:3px solid rgba(255,244,220,.5);transition:transform .15s}
.stop.on i{background:radial-gradient(circle at 35% 30%,#ffe9a8,#ffab2e);color:#4a2500;border-color:#fff;transform:scale(1.18);box-shadow:0 0 22px #ffc54dcc}
.cta{position:relative;overflow:hidden;width:100%;padding:13px 0 15px;border-radius:24px;background:linear-gradient(#ffe07a,#ffb52e 55%,#f7941e);color:#4a2400;font-family:var(--disp);box-shadow:0 6px 0 var(--gold-d),0 14px 28px rgba(0,0,0,.4),inset 0 2px 0 #fff8;transition:transform .06s,box-shadow .06s}
.cta:active{transform:translateY(5px);box-shadow:0 1px 0 var(--gold-d),0 6px 12px rgba(0,0,0,.4),inset 0 2px 0 #fff8}
.cta b{display:block;font-weight:400;font-size:28px;line-height:1.1}
.cta small{display:block;font:800 13px var(--body);opacity:.75}
.cta::after{content:"";position:absolute;top:-20%;bottom:-20%;width:44px;left:-80px;background:rgba(255,255,255,.55);transform:skewX(-20deg);animation:shine 7s ease-in-out infinite}
@keyframes shine{0%,65%{left:-80px}90%,100%{left:115%}}
.card{margin-top:15px;border-radius:22px;background:var(--panel);border:1px solid var(--line);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);padding:12px 14px}
.daily{display:flex;align-items:center;gap:12px}
.cal{width:48px;height:52px;border-radius:12px;background:var(--cream);color:var(--ink);text-align:center;overflow:hidden;flex:none;font-family:var(--disp)}
.cal span{display:block;background:var(--coral);color:#fff;font-size:12px;padding:2px 0}
.cal b{display:block;font-weight:400;font-size:24px;line-height:32px}
.daily h2{font:400 19px var(--disp)}
.daily p{font-size:12px;opacity:.75;font-variant-numeric:tabular-nums}
.go{margin-left:auto;background:var(--teal);color:#05332d;font:400 17px var(--disp);padding:9px 18px;border-radius:14px;box-shadow:0 4px 0 #17998a}
.go:active{transform:translateY(3px);box-shadow:0 1px 0 #17998a}
.streak{display:flex;align-items:center;margin-top:11px;gap:4px;font-size:11px}
.streak .d{flex:1;height:8px;border-radius:9px;background:rgba(255,255,255,.14)}
.streak .d.f{background:linear-gradient(90deg,#ff8a3d,#ffc54d)}
.streak svg{width:22px;height:22px;flex:none}
.nav{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}
.nav button{display:grid;justify-items:center;gap:3px;padding:9px 0 7px;border-radius:18px;background:var(--panel);border:1px solid var(--line);font-size:11px}
.nav button:active,.round:active{transform:scale(.93)}
.nav svg{width:26px;height:26px}
.title{text-align:center;font-family:var(--disp);text-shadow:0 3px 10px rgba(0,0,0,.5);line-height:1}
.title b{display:block;font-weight:400;font-size:24px}
.title small{font:800 12px var(--body);opacity:.85}
.meter{display:flex;justify-content:center;align-items:center;gap:14px;margin-top:10px}
.meter .box{min-width:92px;text-align:center;border-radius:16px;background:var(--panel);border:1px solid var(--line);padding:4px 10px}
.meter .box small{display:block;font-size:11px;opacity:.7}
.meter .box b{font:400 24px var(--disp);font-variant-numeric:tabular-nums}
.stars3{display:flex;gap:2px}
.stars3 svg{width:28px;height:28px;transition:transform .25s,filter .25s}
.stars3 svg.dim{filter:grayscale(1) brightness(.55);transform:scale(.82)}
.mid{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;padding:12px 0}
.tray{position:relative;padding:9px;border-radius:26px;background:linear-gradient(#ffe7b0,#d99a3e 30%,#8a5420);box-shadow:0 18px 40px rgba(0,0,0,.55),inset 0 2px 0 #fff9}
#scn{position:absolute;inset:0;width:100%;height:100%}
#board::after{content:"";position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 5px 16px rgba(0,0,0,.5);border-radius:19px}
#board{position:relative;border-radius:19px;background:#1c1448;box-shadow:inset 0 5px 14px rgba(0,0,0,.65);touch-action:none;overflow:hidden}
.slot{position:absolute;border-radius:14px;border:2px dashed rgba(255,255,255,.22)}
.tile{position:absolute;left:0;top:0;touch-action:none;transition:transform 45ms linear;will-change:transform}
.tile.drag{transition:none}
.face{position:absolute;inset:0 0 5px 0;border-radius:15px;display:grid;place-items:center;font-family:var(--disp);color:#fff;text-shadow:0 2px 0 hsl(var(--h) 70% 26% / .65),0 3px 8px rgba(0,0,0,.3);
background:linear-gradient(165deg,hsl(var(--h) 90% 64% / .70),hsl(var(--h) 80% 44% / .60));box-shadow:0 5px 0 hsl(var(--h) 66% 28% / .75),0 8px 10px rgba(0,0,0,.28),inset 0 2px 0 rgba(255,255,255,.65),inset 0 0 0 1.5px rgba(255,255,255,.38)}
.face::before{content:"";position:absolute;left:7%;right:7%;top:5%;height:38%;border-radius:11px 11px 50% 50%/11px 11px 40% 40%;background:linear-gradient(rgba(255,255,255,.45),rgba(255,255,255,.05))}
.face span{position:relative}
.tile.ok .face{background:linear-gradient(165deg,hsl(var(--h) 100% 76% / .95),hsl(var(--h) 94% 54% / .93));box-shadow:0 5px 0 hsl(var(--h) 80% 38%),0 0 18px hsl(var(--h) 100% 66% / .9),inset 0 0 0 2.5px #fff}
.tile.ok .face::after{content:"";position:absolute;right:8px;top:8px;width:7px;height:7px;border-radius:50%;background:#fff;box-shadow:0 0 8px 2px #fff}
.face span{text-shadow:0 2px 0 hsl(var(--h) 70% 24% / .8),0 0 8px rgba(0,0,0,.55)}
/* season touches on the tiles */
.tray[data-w=snow] .face::before{left:-1px;right:-1px;top:-3px;height:24%;border-radius:14px 14px 45% 55%/12px 12px 90% 70%;background:linear-gradient(#fff,#e4f0ff);box-shadow:0 2px 3px rgba(40,70,120,.25)}
.tray[data-w=rain] .face::before{left:0;right:0;top:0;height:100%;border-radius:15px;background:radial-gradient(circle at 18% 22%,#fff 0 1.5px,rgba(255,255,255,.35) 2px 4px,transparent 5px),radial-gradient(circle at 80% 38%,#fff 0 1px,rgba(255,255,255,.3) 1.5px 3px,transparent 4px),radial-gradient(circle at 30% 76%,#fff 0 1px,rgba(255,255,255,.3) 1.5px 3.500px,transparent 4.500px),radial-gradient(circle at 70% 84%,rgba(255,255,255,.7) 0 1.5px,transparent 3px),linear-gradient(165deg,rgba(255,255,255,.28),transparent 45%)}
.tray[data-w=autumn] .tile:nth-of-type(3n) .face::after,.tray[data-w=spring] .tile:nth-of-type(3n) .face::after{content:"";position:absolute;left:7px;bottom:7px;width:26%;aspect-ratio:1.7;border-radius:100% 0;background:linear-gradient(135deg,#ffc04a,#c4421e);transform:rotate(18deg);box-shadow:0 1px 3px rgba(0,0,0,.3)}
.tray[data-w=spring] .tile:nth-of-type(3n) .face::after{background:linear-gradient(135deg,#fff,#ff9cc4);border-radius:100% 20%}
.tray[data-t=night] .face{box-shadow:0 5px 0 hsl(var(--h) 66% 24% / .8),0 0 12px hsl(var(--h) 90% 60% / .45),inset 0 1.500px 0 rgba(255,255,255,.5),inset 0 0 0 1.500px hsl(var(--h) 100% 82% / .6)}
.tray[data-t=night] .tile.ok .face{box-shadow:0 5px 0 hsl(var(--h) 80% 36%),0 0 20px hsl(var(--h) 100% 66%),inset 0 0 0 2.500px #fff}
.tray::before,.tray::after{position:absolute;pointer-events:none;z-index:2}
.tray[data-w=snow]::before{content:"";left:10px;right:10px;top:-7px;height:14px;background:radial-gradient(ellipse at 50% 100%,#fff 62%,transparent 66%) 0 0/34px 14px repeat-x}
.tray[data-w=autumn]::before,.tray[data-w=spring]::before,.tray[data-w=autumn]::after,.tray[data-w=spring]::after{content:"🍁";font-size:26px;left:-8px;top:-13px;transform:rotate(-24deg)}
.tray[data-w=autumn]::after,.tray[data-w=spring]::after{left:auto;top:auto;right:-8px;bottom:-12px;transform:rotate(150deg)}
.tray[data-w=spring]::before,.tray[data-w=spring]::after{content:"🌸"}
.tile.snap .face{animation:snap .28s ease-out}
@keyframes snap{40%{filter:brightness(1.6)}}
.tile.hint .face{animation:hint .55s ease-in-out 3}
@keyframes hint{50%{transform:scale(1.1);filter:brightness(1.4)}}
.tile.wave .face{animation:wave .5s ease-out}
@keyframes wave{40%{transform:translateY(-14px) scale(1.08);filter:brightness(1.7)}}
.tile.bump .face{animation:bump .14s}
@keyframes bump{40%{transform:translateX(4px)}75%{transform:translateX(-2px)}}
.power{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;padding:0 10px}
.power button{position:relative;display:grid;justify-items:center;gap:2px;padding:9px 0 7px;border-radius:20px;background:var(--panel);border:1px solid var(--line);font-size:12px;box-shadow:0 4px 0 rgba(10,5,30,.7)}
.power button:active{transform:translateY(3px);box-shadow:none}
.power svg{width:28px;height:28px}
.power em{position:absolute;right:-4px;top:-6px;min-width:22px;height:22px;border-radius:12px;background:var(--coral);border:2px solid #fff;font:400 13px/18px var(--disp)}
.demo{margin:12px auto 0;font-size:12px;opacity:.85;text-decoration:underline;padding:6px 10px;text-shadow:0 1px 4px #000}
#win{justify-content:flex-end;align-items:center;text-align:center;background:linear-gradient(transparent 20%,rgba(16,8,44,.72) 70%);z-index:20}
.rays{position:absolute;left:50%;top:23%;width:640px;height:640px;margin:-320px;border-radius:50%;background:repeating-conic-gradient(rgba(255,230,150,.22) 0 9deg,transparent 9deg 24deg);-webkit-mask:radial-gradient(#000 10%,transparent 68%);mask:radial-gradient(#000 10%,transparent 68%);animation:spin 22s linear infinite;pointer-events:none}
@keyframes spin{to{transform:rotate(360deg)}}
.big{display:flex;align-items:flex-end;gap:4px;height:100px;position:relative}
.big svg{width:78px;height:78px;opacity:0;filter:drop-shadow(0 6px 10px rgba(0,0,0,.4))}
.big svg:nth-child(2){width:100px;height:100px;margin-bottom:6px}
.big svg.in{animation:slam .38s cubic-bezier(.3,1.5,.6,1) forwards}
.big svg.in.dim{filter:grayscale(1) brightness(.5)}
@keyframes slam{from{opacity:0;transform:scale(2.8) rotate(-40deg)}to{opacity:1;transform:none}}
#win h2{position:relative;font:400 46px/1 var(--disp);margin:6px 0 2px;text-shadow:0 4px 0 #7a3d8f,0 8px 20px rgba(0,0,0,.5)}
#win .sub{position:relative;font-size:14px;opacity:.9}
.pass{position:relative;width:100%;margin:14px 0;padding:14px;border-radius:20px;background:var(--cream);color:var(--ink);display:flex;align-items:center;gap:12px;text-align:left;box-shadow:0 12px 30px rgba(0,0,0,.4)}
.pass h3{font:400 19px var(--disp)}
.pass p{font-size:12px;opacity:.7}
.dots{display:flex;gap:5px;margin-top:7px}
.dots i{width:18px;height:8px;border-radius:8px;background:#d9cdb0}
.dots i.f{background:#f7941e}
.stamp{margin-left:auto;width:82px;height:82px;flex:none;border:4px double #b8324f;border-radius:50%;color:#b8324f;display:grid;place-content:center;text-align:center;font:400 15px/1.05 var(--disp);opacity:0;transform:rotate(-14deg)}
.stamp.in{animation:stamp .3s cubic-bezier(.4,0,.8,.6) forwards}
@keyframes stamp{from{opacity:0;transform:rotate(-14deg) scale(2.6)}to{opacity:.95;transform:rotate(-14deg) scale(1)}}
.reward{position:relative;display:flex;gap:10px;justify-content:center;margin-bottom:14px}
#win .cta{margin-bottom:6px}
 .nav{row-gap:8px}
.nav button{white-space:nowrap;min-width:0}
.links{display:flex;justify-content:center;gap:18px;font-size:12px;margin-top:6px;text-shadow:0 1px 4px #000}
.links button{text-decoration:underline;padding:5px 0}
.links span{opacity:.6;padding:5px 0}
#home>*{flex-shrink:0}#home>.space{flex-shrink:1}
#levels{background:rgba(18,10,48,.88);z-index:10}
#levels>*{flex-shrink:0}
.lhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.city{margin-top:14px;min-height:232px;padding:12px;border-radius:22px;background:var(--ink) center 35%/cover no-repeat;border:2px solid rgba(255,244,220,.35);display:flex;flex-direction:column;justify-content:space-between;box-shadow:0 8px 20px rgba(0,0,0,.4)}
.city h3{text-shadow:0 2px 4px rgba(0,0,0,.8),0 0 12px rgba(0,0,0,.6)}
.city h3{display:flex;justify-content:space-between;align-items:baseline;font:400 19px var(--disp);margin-bottom:9px}
.city h3 small{font:800 12px var(--body);opacity:.7}
.grid5{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.lv{height:58px;border-radius:14px;display:grid;place-content:center;justify-items:center;background:linear-gradient(165deg,#8a6cf0,#5236b8);box-shadow:0 4px 0 #33207a;font:400 20px var(--disp)}
.lv small{font-size:11px;letter-spacing:1px;color:#ffd65c;height:13px;line-height:13px}
.lv.now{background:linear-gradient(165deg,#ffe07a,#f7941e);color:#4a2400;box-shadow:0 4px 0 var(--gold-d),0 0 16px #ffc54dcc}
.lv.lock{background:rgba(20,12,50,.62);box-shadow:none;color:rgba(255,244,220,.7);border:1px solid rgba(255,244,220,.25)}
@media (max-height:690px){.logo{margin-top:2px}.logo svg{width:200px}.nav button{padding:6px 0 5px}.nav svg{width:22px;height:22px}}
.tm[aria-pressed="false"]{opacity:.55}
@media (max-width:389px){#home .chip{font-size:14px;gap:4px;padding:0 8px 0 4px}#home .chip svg{width:20px;height:20px}#home .bar{gap:5px}#home .round{width:36px;height:36px}}
#sheet{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(100%,440px);z-index:25;background:rgba(24,16,58,.94);border-radius:24px 24px 0 0;padding:14px 12px calc(env(safe-area-inset-bottom,0px) + 14px);display:grid;gap:9px}
#sheet[hidden]{display:none}
#sheet .row{display:flex;flex-wrap:wrap;gap:7px;justify-content:center}
#sheet .row button{padding:8px 12px;border-radius:12px;background:rgba(255,255,255,.1);font-size:13px;text-transform:capitalize}
#sheet .row button.on{background:var(--gold);color:#4a2400}
#sheet .go{margin:2px auto 0}
body.light.playing #veil{opacity:.4}
body.light .title,body.light .route .stop,body.light .demo{text-shadow:0 1px 3px #000,0 0 10px rgba(0,0,0,.6)}
body.light #game .title{background:rgba(24,16,58,.55);border-radius:16px;padding:3px 14px;margin-right:0!important;margin-left:0!important}
.credit{font-size:10px;text-align:center;opacity:.6;font-weight:600}
.toast{position:fixed;left:50%;bottom:110px;transform:translate(-50%,16px);background:var(--cream);color:var(--ink);padding:9px 14px;border-radius:14px;font-size:13px;opacity:0;pointer-events:none;transition:.2s;z-index:40;width:max-content;max-width:86%;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media (max-height:690px){.logo{margin-top:6px}.logo svg{width:250px}.stop i{width:34px;height:34px}.route::before{top:16px}.card{margin-top:11px;padding:9px 12px}.space{min-height:6px}.big{transform:scale(.8)}}
@media (prefers-reduced-motion:reduce){.cta::after,.rays{animation:none;display:none}.tile{transition-duration:40ms}}
</style>
</head>
<body>
<canvas id="sky" aria-hidden="true"></canvas>
<div id="veil"></div>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
 <defs>
  <linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff0a8"/><stop offset="1" stop-color="#ff9d1e"/></linearGradient>
  <linearGradient id="gm" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#b6fff4"/><stop offset="1" stop-color="#2a8fff"/></linearGradient>
 </defs>
 <symbol id="coin" viewBox="0 0 24 24"><circle cx="12" cy="12" r="11" fill="url(#g)" stroke="#a85f0c" stroke-width="1.5"/><circle cx="12" cy="12" r="6.5" fill="none" stroke="#b86a10" stroke-width="2"/></symbol>
 <symbol id="gem" viewBox="0 0 24 24"><path d="M6 3h12l5 7-11 12L1 10z" fill="url(#gm)" stroke="#fff" stroke-width="1.2"/><path d="M1 10h22M8 10l4 12 4-12-4-7z" fill="none" stroke="#fff" stroke-opacity=".6"/></symbol>
 <symbol id="star" viewBox="0 0 24 24"><path d="M12 1.5l3.1 6.6 7.2.9-5.3 5 1.4 7.2L12 17.6l-6.4 3.6L7 14l-5.3-5 7.2-.9z" fill="url(#g)" stroke="#a85f0c" stroke-width="1.2" stroke-linejoin="round"/></symbol>
 <symbol id="chest" viewBox="0 0 24 24"><path d="M3 10q0-6 9-6t9 6v10H3z" fill="#b9692a" stroke="#ffd56b" stroke-width="1.6"/><path d="M3 11h18" stroke="#ffd56b" stroke-width="1.8"/><rect x="10" y="9" width="4" height="6" rx="1" fill="#ffd56b"/></symbol>
</svg>

<!-- HOME -->
<main class="screen" id="home">
 <div class="bar">
  <div class="chip"><svg class="coin"><use href="#coin"/></svg><span class="coins">1,240</span></div>
  <div class="chip"><svg class="gem"><use href="#gem"/></svg>35</div>
  <div class="chip"><svg class="star"><use href="#star"/></svg>14</div>
  <button class="round tm" aria-label="Music on or off"></button>
  <button class="round" id="mute" aria-label="Sound effects on or off"></button>
 </div>
 <h1 class="logo">
  <svg viewBox="0 0 350 150" role="img" aria-label="Sliding Numbers plus">
   <g font-family="Lilita One,Arial Rounded MT Bold,sans-serif" text-anchor="middle" stroke="#3a1c66" stroke-width="10" stroke-linejoin="round" paint-order="stroke">
    <text x="175" y="60" font-size="66" fill="#fff4dc">Sliding</text>
    <text x="165" y="128" font-size="66" fill="url(#g)">Numbers</text>
    <text x="316" y="108" font-size="62" fill="#43e6d2">+</text>
   </g>
  </svg>
 </h1>
 <button class="demo skyBtn" style="margin-top:2px">Preview: change sky</button>
 <div class="space"></div>
 <div class="route" id="route"></div>
 <button class="cta" id="play"><b>Continue</b><small id="playSub"></small></button>
 <section class="card">

function start(daily){isDaily=daily;snd.click();show('game');newLevel()}
function goHome(){paintRoute();snd.click();session++;timers.forEach(clearTimeout);timers=[];parts=[];litTarget=0;setCoins(coins);show('home')}
let tt,keepSky=false;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),2200)}
$('#play').onclick=()=>start(false);$('#daily').onclick=()=>start(true);
$('#back').onclick=goHome;$('#lBack').onclick=goHome;
$('#openLevels').onclick=()=>{snd.click();paintLevels();show('levels');const n=$('.lv.now');if(n)n.closest('.city').scrollIntoView({block:'center'})};
$('#unlock').onclick=()=>{unlocked=!unlocked;$('#unlock').textContent=unlocked?'Preview: lock levels again':'Preview: unlock all levels';paintLevels()};$('#toHome').onclick=goHome;
$('#restart').onclick=()=>{snd.click();newLevel()};
$('#next').onclick=()=>{setCoins(coins);setLevel(lvl>=35?1:lvl+1);start(false)};
$('#undo').onclick=()=>{if(solved)return;if(!history.length)return toast('Make a move first');if(!undos)return toast('No undos left');
 const target=history.pop(),v=grid[target],l=v&&line(v);if(!l)return;undos--;moves--;slide(l,false)};
$('#hint').onclick=()=>{if(solved||!path.length)return;if(!hints){return toast('No hints left')}hints--;hud();snd.click();flash(els[grid[path[path.length-1]]],'hint',1700)};
$('#skip').onclick=()=>{if(solved)return;snd.click();
 grid=Array.from({length:R*C},(_,i)=>goal(i));path=[];history=[];step(R*C-2);moves=par-1;placed=new Set(grid.filter((v,i)=>v&&v===goal(i)));render();mark();hud();
 toast(`Tap ${grid[R*C-1]} to finish`);flash(els[grid[R*C-1]],'hint',1700)};
$$('[data-soon]').forEach(b=>b.onclick=()=>{snd.click();toast(b.dataset.soon)});
function paintSheet(){
 const row=(id,list,on,set)=>{$(id).innerHTML=list.map(([v,l])=>`<button class="${v===on?'on':''}" data-v="${v}">${l}</button>`).join('');$$(id+' button').forEach(b=>b.onclick=()=>{set(b.dataset.v);$('#gCity').textContent=TOUR[ART.indexOf(cur)];buildCity();themeBoard();startMusic();paintSheet()})};
 row('#sCity',ART.map((a,i)=>[String(a),TOUR[i]]),String(cur),v=>cur=+v);
 row('#sTime',['sunrise','day','sunset','night'].map(v=>[v,v==='day'?'sunny':v]),tm,v=>tm=v);
 row('#sWx',['clear','rain','snow','autumn','spring'].map(v=>[v,v]),wx,v=>wx=v);
}
$$('.skyBtn').forEach(b=>b.onclick=()=>{snd.click();$('#sheet').hidden=false;paintSheet()});$('#sClose').onclick=()=>$('#sheet').hidden=true;
$('#mute').innerHTML=ICON(true);$('#mute').onclick=()=>{muted=!muted;$('#mute').innerHTML=ICON(!muted);snd.click()};

function clock(){const n=new Date(),ms=Date.UTC(n.getUTCFullYear(),n.getUTCMonth(),n.getUTCDate()+1)-n,p=x=>String(x).padStart(2,'0');
 $('#count').textContent=`${p(ms/36e5|0)}:${p(ms/6e4%60|0)}:${p(ms/1000%60|0)}`;
 $('#day').textContent=n.getUTCDate();$('#mon').textContent=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][n.getUTCMonth()]}
let rt;addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(()=>{resize();if(!$('#game').classList.contains('off')&&!solved)layout()},120)});
$$('.tm').forEach(b=>b.onclick=()=>{music=!music;paintMusic();if(music)startMusic();else stopMusic();toast(music?'Music on':'Music off')});
/* browsers only allow sound after a touch */
addEventListener('click',e=>{if(!e.target.closest('.tm'))startMusic()});
document.addEventListener('visibilitychange',()=>{if(document.hidden){stopMusic();if(ac)ac.suspend()}else{if(ac)ac.resume();startMusic()}});
paintMusic();mood(lvl);resize();paintRoute();clock();setInterval(clock,1000);requestAnimationFrame(loop);
})();
</script>
</body>
</html>
